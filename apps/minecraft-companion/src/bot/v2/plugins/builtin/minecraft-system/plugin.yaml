schema: mineclaw.plugin/v1
id: mineclaw.minecraft-system
version: 1.0.0
apiVersion: ^2.0.0
kind: system
entry: index
dependencies: {}
permissions:
  - system.adapter
  - system.atomic
contributions:
  - kind: execution
    id: mineclaw.minecraft-system.execution.atomics
    version: 1.0.0
    atomicIds:
      - say
      - move_to
      - follow_entity
      - equip
      - place_block
      - dig
      - attack
      - touch
      - open_container
      - transfer_chest
      - toss
      - pickup
      - use_item
      - sleep
  - kind: integration
    id: mineclaw.minecraft-system.integration.game
    version: 1.0.0
